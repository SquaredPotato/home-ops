---
originRequest:
  originServerName: "external.${SECRET_DOMAIN}"

ingress:
  - hostname: "${SECRET_DOMAIN}"
    service: &svc https://external.network.svc.cluster.local
  - hostname: "*.${SECRET_DOMAIN}"
    service: *svc
  - hostname: "riva-va.nl"
    service: *svc
  - hostname: "*.riva-va.nl"
    service: *svc
  - service: http_status:404
