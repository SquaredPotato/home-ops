---
clusterName: hypernetes
clusterEndpoint: https://10.0.2.100:6443

# renovate: datasource=github-releases depName=siderolabs/talos
talosVersion: v1.14.5
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.37.2

secretsPath: talsecret.sops.yaml

nodes:
  - &controlNode
    host: "mizu-10"
    ip: "10.0.2.10"
    role: control-plane
    secureboot: false
    schematicId: "@schematic.yaml.tpl"
    data:
      kernelModules: []
      installDiskSelector: 'disk.dev_path == "/dev/nvme0n1"'
      macAddr: "e4:5f:01:e5:ed:8c"
      mtu: 1500
  - <<: *controlNode
    host: "mizu-11"
    ip: "10.0.2.11"
    data:
      kernelModules: [ ]
      installDiskSelector: 'disk.dev_path == "/dev/nvme0n1"'
      macAddr: "e4:5f:01:e5:ec:e1"
      mtu: 1500
  - <<: *controlNode
    host: "mizu-12"
    ip: "10.0.2.12"
    data:
      kernelModules: [ ]
      installDiskSelector: 'disk.dev_path == "/dev/nvme0n1"'
      macAddr: "e4:5f:01:e5:ec:4f"
      mtu: 1500
  - <<: *controlNode
    host: "mizu-13"
    ip: "10.0.2.13"
    data:
      kernelModules: [ ]
      installDiskSelector: 'disk.dev_path == "/dev/nvme0n1"'
      macAddr: "e4:5f:01:e5:ed:96"
      mtu: 1500

  - &workerNode
    host: "mizu-20"
    ip: "10.0.2.20"
    role: worker
    schematicId: "@schematic.yaml.tpl"
    data:
      kernelModules: ["vfio_pci", "uio_pci_generic", "nvme_tcp", "ublk_drv"]
      installDiskSelector: 'disk.dev_path == "/dev/sda"'
      longhornDiskSelector: 'disk.transport == "nvme"'
      macAddr: "c0:25:a5:d0:8e:c0"
      mtu: 1500
  - <<: *workerNode
    host: "mizu-21"
    ip: "10.0.2.21"
    data:
      kernelModules: ["vfio_pci", "uio_pci_generic", "nvme_tcp", "ublk_drv"]
      installDiskSelector: 'disk.dev_path == "/dev/sda"'
      longhornDiskSelector: 'disk.transport == "nvme"'
      macAddr: "c8:5a:cf:c1:31:2b"
      mtu: 1500
  - <<: *workerNode
    host: "mizu-22"
    ip: "10.0.2.22"
    data:
      kernelModules: ["vfio_pci", "uio_pci_generic", "nvme_tcp", "ublk_drv"]
      installDiskSelector: 'disk.dev_path == "/dev/sda"'
      longhornDiskSelector: 'disk.transport == "nvme"'
      macAddr: "a4:bb:6d:71:c0:be"
      mtu: 1500
