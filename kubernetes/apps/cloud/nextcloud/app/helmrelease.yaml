---
# yaml-language-server: $schema=https://kubernetes-schemas.18b.haus/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
spec:
  chart:
    spec:
      chart: nextcloud
      version: 9.4.1
      sourceRef:
        kind: HelmRepository
        name: nextcloud
        namespace: flux-system
  interval: 2h
  install:
    timeout: 60m
  upgrade:
    timeout: 60m
  values:
    deploymentAnnotations:
      secret.reloader.stakater.com/reload: nextcloud
    image:
      registry: public.ecr.aws
      repository: docker/library/nextcloud
      flavor: fpm-alpine
    phpClientHttpsFix:
      enabled: true
    nextcloud:
      host: next.${SECRET_DOMAIN}
      securityContext:
        runAsUser: &uid 101000
        runAsGroup: &gid 101000
        runAsNonRoot: true
        readOnlyRootFilesystem: false
      extraEnv:
        - name: REDIS_HOST
          value: "${DRAGONFLY_HOST}"
        - name: REDIS_DATABASE
          value: "${quote}${REDIS_NEXTCLOUD_DB}${quote}"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: &secret nextcloud
              key: REDIS_PASSWORD
        - name: OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: *secret
              key: OIDC_CLIENT_ID
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: *secret
              key: OIDC_CLIENT_SECRET
      extraVolumes:
        - name: data
          nfs:
            server: "${LAN_TRUENAS_IP}"
            path: "/mnt/fast/storage/nextcloud"
            readOnly: false
        - name: media
          nfs:
            server: "${LAN_TRUENAS_IP}"
            path: "/mnt/MAIN/media"
            readOnly: false
        - name: miscellaneous
          nfs:
            server: "${LAN_TRUENAS_IP}"
            path: "/mnt/MAIN/miscellaneous"
            readOnly: false
      extraVolumeMounts:
        - name: data
          mountPath: "/mnt/mediavault/nextcloud"
        - name: media
          mountPath: "/mnt/storage/media"
        - name: miscellaneous
          mountPath: "/mnt/storage/miscellaneous"
      mail:
        enabled: true
        fromAddress: ${SMTP_USERNAME}
        domain: ${SECRET_DOMAIN}
        smtp:
          name: "service"
          port: ${SMTP_PORT}
          password: ${SMTP_PASSWORD}
      defaultConfigs:
        redis.config.php: false
      configs:
        local.config.php: |-
          <?php
          $CONFIG = array(
            'trusted_proxies' => array(
              '127.0.0.1',
              '10.0.0.0/8',
            ),
            'forwarded_for_headers' => array('HTTP_X_FORWARDED_FOR'),
            'default_phone_region' => 'NL',
            'auth.bruteforce.protection.enabled' => true,
            'maintenance_window_start' => 1,
            'datadirectory' => '/mnt/mediavault/nextcloud/data',
            'defaultapp' => 'files',
            'simpleSignUpLink.shown' => false,
          );
        redis.config.php: |-
          <?php
          $CONFIG = array(
            'memcache.distributed' => '\OC\Memcache\Redis',
            'memcache.locking' => '\OC\Memcache\Redis',
            'redis' => array(
              'host' => getenv('REDIS_HOST'),
              'port' => getenv('REDIS_PORT'),
              'dbindex' => getenv('REDIS_DATABASE'),
            ),
          );
        sso.config.php: |-
          <?php
          $CONFIG = array(
            'allow_user_to_change_display_name' => false,
            'lost_password_link' => 'disabled',
            'oidc_login_client_id' => getenv('OIDC_CLIENT_ID'),
            'oidc_login_client_secret' => getenv('OIDC_CLIENT_SECRET'),
            'oidc_login_provider_url' => 'https://sso.${SECRET_DOMAIN}/application/o/nextcloud/',
            'oidc_login_end_session_redirect' => true,
            'oidc_login_logout_url' => 'https://sso.${SECRET_DOMAIN}/application/o/nextcloud/end-session/',
            'oidc_login_hide_password_form' => true,
            'oidc_login_disable_registration' => false,
            'oidc_login_webdav_enabled' => true,
            'oidc_login_attributes' => array(
              'id' => 'sub',
              'name' => 'name',
              'mail' => 'email',
              'groups' => 'nextcloud_groups',
              'is_admin' => 'nextcloud_admin',
            ),
            'oidc_login_scope' => 'openid profile email nextcloud',
            'oidc_login_default_group' => 'oidc',
            'oidc_create_groups' => true,
            'oidc_login_auto_redirect' => true, // bypass via /login?noredir=1
          );
      phpConfigs:
        uploadLimit.ini: |
          upload_max_filesize = 16G
          post_max_size = 16G
          max_input_time = 7200
          max_execution_time = 36004
    resources:
      requests:
        cpu: 750m
        memory: 512Mi
      limits:
        memory: 2Gi
    startupProbe:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 360
      successThreshold: 1
    livenessProbe:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1
    readinessProbe:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1
    httpRoute:
      enabled: false
    nginx:
      enabled: false
    internalDatabase:
      enabled: false
    externalDatabase:
      enabled: true
      type: postgresql
      database: nextcloud
      host: "${POSTGRES_HOST}"
      existingSecret:
        enabled: true
        secretName: *secret
        passwordKey: POSTGRES_PASSWORD
        usernameKey: POSTGRES_USER
    redis:
      enabled: false
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    cronjob:
      enabled: true
      sidecar:
        securityContext:
          runAsGroup: *gid
    securityContext:
      fsGroupChangePolicy: OnRootMismatch